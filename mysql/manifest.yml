apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: kubernetes
spec:
  replicas: 1
  selector: 
    matchLabels:
      project: roboshop
      environment: dev
      component: mongodb
      tier: db
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        component: mongodb
        tier: db
    spec:
      containers:
      - name: mysql
        image: kirankumarkosuri/mysql:v1
        imagePullPolicy: Always
        readinessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: kubernetes
spec:
  selector:
    project: roboshop
    environment: dev
    component: mongodb
    tier: db
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306