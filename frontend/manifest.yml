apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: roboshop
spec:
  replicas: 1
  selector: 
    matchLabels:
      project: roboshop
      environment: dev
      component: frontend
      tier: backend
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        component: frontend
        tier: backend
    spec:
      containers:
      - name: cart
        image: kirankumarkosuri/frontend:v1
        imagePullPolicy: Always
        readinessProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 1
            periodSeconds: 15

        livenessProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 1
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: roboshop
spec:
  type: LoadBalancer
  selector:
    project: roboshop
    environment: dev
    component: frontend
    tier: backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80