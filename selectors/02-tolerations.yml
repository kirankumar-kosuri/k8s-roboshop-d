apiVersion: apps/v1
kind: Deployment
metadata:
  name: taint-tolerations
  namespace: roboshop
  labels:
    name: nginx
    purpose: tolerations-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      name: nginx
      purpose: tolerations-demo
  template:
    metadata:
      labels:
        name: nginx
        purpose: tolerations-demo
    spec:
    nodeSelector:
      kubernetes.io/hostname: ip-192-168-29-201.ec2.internal
      containers:
      - name: nginx
        image: nginx
      tolerations:
      - key: "project"
        operator: "Equal"
        value: "roboshop"
        effect: "NoSchedule"