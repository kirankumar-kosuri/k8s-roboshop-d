apiVersion: apps/v1
kind: Deployment
metadata:
  name: taint-tolerations
  namespace: roboshop
  labels:
    name: nginx
    purpose: tolerations-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      name: nginx
      purpose: tolerations-demo
  template:
    metadata:
      labels:
        name: nginx
        purpose: tolerations-demo
    spec:
      containers:
      - name: nginx
        image: nginx