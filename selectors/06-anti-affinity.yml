apiVersion: v1
kind: Pod
metadata:
  name: pod-3
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - pod-1
                  - pod-2
          topologyKey: topology.kubernetes.io/zone

  containers:
    - name: nginx
      image: nginx
      imagePullPolicy: Always