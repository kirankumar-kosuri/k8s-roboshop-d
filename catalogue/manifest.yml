apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: kubernetes
spec:
  replicas: 1
  selector:
    matchLabels: 
      project: roboshop
      environment: dev
      component: catalogue
      tier: backend
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        component: catalogue
        tier: backend
    spec:
      containers:
      - name: catalogue
        image: kirankumarkosuri/catalogue:v1
        ports:
        - name: liveness-port
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: kubernetes
spec:
  selector:
    project: roboshop
    environment: dev
    component: catalogue
    tier: backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080

